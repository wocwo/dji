retrieval:
  chroma_db_path: ./chroma_final
  collection_name: uav_manual_db
  embedding_model_type: precomputed
  embedding_cache_path: embed_cache.npz
  multipath_top_k: 50
  final_top_k: 10
  reranker_type: cross_encoder
  reranker_threshold: 0.3
llm:
  backend: vllm
  model_name: Qwen/Qwen2-7B-Instruct-AWQ
  base_url: http://localhost:8000
  timeout: 120.0
  temperature: 0.3
  top_p: 0.9
  max_tokens: 2048
  frequency_penalty: 0.0
  vllm_mode: server
pipeline:
  max_context_chars: 8000
  score_threshold: 0.3
  enable_logging: true
  log_level: WARNING
  enable_post_processing: true
  add_citations: true
  add_disclaimer: true
  max_retries: 3
  retry_delay: 1.0
logging:
  level: WARNING
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file: logs/rag_pipeline.log
