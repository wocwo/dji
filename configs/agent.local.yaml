# 本地 Qwen3.5-4B 配置（4GB 显存 / 16GB 内存）
# ollama pull qwen3.5:4b

agent:
  name: dji-manual-agent-local
  max_steps: 6
  max_tool_calls: 10
  max_llm_calls: 8
  max_seconds: 300
  max_consecutive_errors: 3
  max_observation_chars: 3500
  max_history_chars: 8000
  plain_text_final: true
  evidence_guard: true
  evidence_auto_search: true
  max_evidence_retries: 1
  grounding_check: true
  claim_verifier: false
  claim_verifier_max_claims: 8

llm:
  provider: ollama
  model: qwen3.5:4b
  base_url: http://localhost:11434
  temperature: 0.2
  max_tokens: 1200
  timeout: 240
  tool_mode: native
  thinking: false
  num_ctx: 16384

knowledge:
  backend: jsonl
  jsonl_path: data/agent_manual_kb.jsonl
  chroma_path: ./chroma_final
  collection: uav_manual_db
  top_k: 4
  candidate_limit: 300
  max_terms: 6
  search_timeout: 25
  max_passage_chars: 1200

memory:
  enabled: true
  db_path: .agent/memory.db
  history_turns: 4

trace:
  enabled: true
  dir: .agent/traces
  include_llm_output: false

tools:
  enabled:
    - manual_search
    - manual_fetch
    - calculator
    - clock
    - update_plan
    - save_note
    - recall_notes
  allow_risky: false
  timeout: 45
